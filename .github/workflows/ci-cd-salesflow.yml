name: SalesFlow CI/CD
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Tests
        run: mvn test

      - name: Package
        run: mvn clean package

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/salesflow:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/salesflow:${{ github.run_number }} \
            .

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME}}/salesflow:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/salesflow:${{ github.run_number }}

      - name: Copy Docker Compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/salesflow"


      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/salesflow
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f
            sudo docker ps
            


